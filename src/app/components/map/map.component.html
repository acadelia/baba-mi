<div class="grid">
  <div class="row" *ngFor="let row of grid(); let rowIndex = index">
    <div
      class="cell"
      *ngFor="let cell of row; let colIndex = index"
      [class.top]="!hasTop(rowIndex, colIndex)"
      [class.bottom]="!hasBottom(rowIndex, colIndex)"
      [class.left]="!hasLeft(rowIndex, colIndex)"
      [class.right]="!hasRight(rowIndex, colIndex)"
    >
      <img
        src="assets/flag.jpg"
        class="flag"
        [class.visible]="findMapPosition(rowIndex, colIndex, flagPosition())"
      />
      <img
        src="assets/matcha.jpg"
        class="flag"
        [class.visible]="findMapPosition(rowIndex, colIndex, obstacles())"
      />
    </div>
  </div>
  <img src="assets/hello-kitty-char.png" class="character" [style.transform]="move(position())" />
</div>

<div class="finish-block" [class.visible]="reachedFlag()">
  <img src="assets/giphy.gif" class="finish-image" />
  <button class="btn glitch" (click)="nextLevel()">
    <span>Continue</span>
  </button>
</div>
